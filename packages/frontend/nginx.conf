server {
    listen 80;
    server_name localhost;
    client_max_body_size 10m; # 允许最大 10MB 的请求体

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- Security headers ---
    # 注意: nginx 的 add_header 不会继承到自己声明了 add_header 的 location 中，
    # 因此下方带有 add_header 的 location 会重复这一组头部。
    # - frame-ancestors / X-Frame-Options: 禁止被其他站点嵌入 (点击劫持)。
    # - object-src 'none' / base-uri 'self': 限制插件对象与 <base> 劫持。
    # 暂不强制 script-src (index.html 内有内联启动脚本)；Report-Only 策略仅在浏览器控制台报告，不拦截。
    # 自定义终端背景 HTML 运行在 sandbox iframe (srcdoc) 中，与这些策略兼容。
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Content-Security-Policy-Report-Only "script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location ^~ /api/ { # Use ^~ for preferential prefix matching
        proxy_pass http://backend:3001; # Proxy to backend root, backend expects /api/v1/...

        # Standard proxy headers
        proxy_set_header Host $http_host; # 保留端口，后端 WebSocket Origin 校验会比较端口
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed by the backend API)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 130s;

        # 后端 (helmet) 也会发送这些头部；隐藏上游副本，避免与上面 server 级的头部重复 / 冲突。
        # 后端自己的 Content-Security-Policy 保留 (多个 CSP 同时生效，取交集)。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Proxy WebSocket requests to the backend service
    location /ws/ {
        proxy_pass http://backend:3001; # Assuming backend handles WS on the same port

        # Required headers for WebSocket proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $http_host; # 保留端口，后端 WebSocket Origin 校验会比较端口
        proxy_cache_bypass $http_upgrade; # Prevent caching issues
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness endpoint for the docker-compose healthcheck (no logging, no backend dependency)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cache static assets aggressively
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
        # add_header in this block disables inheritance from the server level: repeat the security headers.
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Content-Security-Policy-Report-Only "script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
