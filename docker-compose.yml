services:
  frontend:
    image: ghcr.io/caichengle666/nexus-terminal-frontend:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DEPLOYMENT_MODE: ${VITE_DEPLOYMENT_MODE:-docker}
    container_name: nexus-terminal-frontend
    ports:
      - "18111:80"
    depends_on:
      backend:
        condition: service_healthy
      # 前端不代理网关流量；网关未就绪 (例如未配置 REMOTE_GATEWAY_SECRET) 时不应阻止前端启动
      remote-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexus-terminal-network
    restart: unless-stopped

  backend:
    image: ghcr.io/caichengle666/nexus-terminal-backend:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: nexus-terminal-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # 前端容器中的 nginx 是后端前面唯一的一层代理：信任 1 跳，req.ip 即真实客户端 IP。
      # 若在前面再加一层反向代理，请在 .env 中设置 TRUST_PROXY=代理层数 (如 2)，参阅 README。
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      # 后端与远程桌面网关共享的密钥 (install.sh 会自动生成到 .env)
      REMOTE_GATEWAY_SECRET: ${REMOTE_GATEWAY_SECRET:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - nexus-terminal-network
    restart: unless-stopped

  remote-gateway:
    image: ghcr.io/caichengle666/nexus-terminal-remote-gateway:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/remote-gateway/Dockerfile
    container_name: nexus-terminal-remote-gateway
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      REMOTE_GATEWAY_API_PORT: 9090
      REMOTE_GATEWAY_WS_PORT: 8080
      FRONTEND_URL: http://frontend
      MAIN_BACKEND_URL: http://backend:3001
      NODE_ENV: production
      # 令牌 API 监听地址。留空 (默认) 时：设置了 REMOTE_GATEWAY_SECRET 则监听所有接口
      # (后端需通过 Docker 网络以服务名 remote-gateway 访问，因此不能只监听 127.0.0.1)，
      # 未设置密钥则仅监听 127.0.0.1 (后端无法访问，远程桌面不可用)。
      # 显式设置为非回环地址 (如 '*') 但未设置密钥时，网关会拒绝启动。
      REMOTE_GATEWAY_API_HOST: ${REMOTE_GATEWAY_API_HOST:-}
      REMOTE_GATEWAY_SECRET: ${REMOTE_GATEWAY_SECRET:-}
    healthcheck:
      # /api/health 在 guacd 不可达时返回 503
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nexus-terminal-network
    depends_on:
      guacd:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: nexus-terminal-guacd
    networks:
      - nexus-terminal-network
    restart: unless-stopped

networks:
  nexus-terminal-network:
    driver: bridge
    name: nexus-terminal-network
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd01::/80    
          gateway: fd01::1    
