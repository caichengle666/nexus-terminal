name: Build Desktop App

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "0.*"
  workflow_dispatch:

# Least privilege: build jobs only read the repository; only the release job
# can write (create/update the GitHub release).
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: packages/frontend
        run: npm run build

      - name: Build backend production bundle
        working-directory: packages/backend
        run: npm run build:prod

      - name: Install Electron app dependencies
        working-directory: electron-app
        run: npm ci

      - name: Prepare bundled Node.js runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "electron-app/nodejs-runtime/win-x64" | Out-Null
          Copy-Item -Path (Get-Command node).Source -Destination "electron-app/nodejs-runtime/win-x64/node.exe" -Force

      - name: Build Electron app
        working-directory: electron-app
        # --publish never: no GitHub token needed (publishing happens in the release job).
        run: npx electron-builder build --win --config --publish never

      - name: Create portable unpacked zip
        shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path "electron-app/dist/win-unpacked/.Portable" | Out-Null
          $source = Resolve-Path "electron-app/dist/win-unpacked"
          $destination = [System.IO.Path]::GetFullPath("electron-app/dist/Nexus Terminal Portable win-unpacked.zip")
          Push-Location $source
          try {
            & 7z a -tzip -mx=9 -mm=Deflate -mfb=258 -mpass=15 $destination ".\*"
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 7
          name: Nexus-Terminal-Windows-Installer
          path: electron-app/dist/*Setup*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload portable unpacked artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 7
          name: Nexus-Terminal-Windows-Portable-Unpacked
          path: electron-app/dist/*Portable win-unpacked.zip
          if-no-files-found: error
          compression-level: 0

  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: packages/frontend
        run: npm run build

      - name: Build backend production bundle
        working-directory: packages/backend
        run: npm run build:prod

      - name: Install Electron app dependencies
        working-directory: electron-app
        run: npm ci

      - name: Prepare bundled Node.js runtime
        shell: bash
        run: |
          mkdir -p electron-app/nodejs-runtime/darwin-${{ matrix.arch }}
          cp $(which node) electron-app/nodejs-runtime/darwin-${{ matrix.arch }}/node
          chmod +x electron-app/nodejs-runtime/darwin-${{ matrix.arch }}/node

      - name: Build Electron app (macOS ${{ matrix.arch }})
        working-directory: electron-app
        # --publish never: no GitHub token needed (publishing happens in the release job).
        run: npx electron-builder build --mac --${{ matrix.arch }} --config --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 7
          name: Nexus-Terminal-macOS-${{ matrix.arch }}
          path: electron-app/dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout signing script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
          sparse-checkout: |
            electron-app/scripts
            electron-app/update-public-key.js
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Normalize release filenames
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"
            normalized_filename="${filename// /.}"
            if [[ "$filename" != "$normalized_filename" ]]; then
              mv -- "$file" "$directory/$normalized_filename"
            fi
          done < <(find Nexus-Terminal-Windows-Installer Nexus-Terminal-Windows-Portable-Unpacked Nexus-Terminal-macOS-arm64 Nexus-Terminal-macOS-x64 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -print0)

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          : > SHA256SUMS.txt
          while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum -- "$(basename "$file")") >> SHA256SUMS.txt
          done < <(find Nexus-Terminal-Windows-Installer Nexus-Terminal-Windows-Portable-Unpacked Nexus-Terminal-macOS-arm64 Nexus-Terminal-macOS-x64 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -print0 | sort -z)

      # Signing stays optional: the UPDATE_SIGNING_KEY secret is not configured for
      # this repository yet. The desktop updater accepts unsigned manifests only
      # while electron-app/update-public-key.js is empty; once a public key is
      # committed there, unsigned/invalid manifests are refused, so add the
      # secret (and make this step fail when it is missing) at the same time.
      - name: Sign SHA-256 manifest (optional)
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::warning::UPDATE_SIGNING_KEY secret is not set; SHA256SUMS.txt will not be signed (see electron-app/UPDATE_SIGNING.md)."
            exit 0
          fi
          node repo/electron-app/scripts/sign-update-manifest.js SHA256SUMS.txt SHA256SUMS.txt.sig

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          overwrite: true
          files: |
            Nexus-Terminal-Windows-Installer/*.exe
            Nexus-Terminal-Windows-Portable-Unpacked/*.zip
            Nexus-Terminal-macOS-arm64/*.dmg
            Nexus-Terminal-macOS-x64/*.dmg
            SHA256SUMS.txt
            SHA256SUMS.txt.sig
